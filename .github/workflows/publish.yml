name: Publish Cabbit Visuals release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: cabbit-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: detanetov/cabbit-visuals
      RELEASE_VERSION: '0.8.1.0'
      EXPECTED_SHA256: 'd188c66761e417eb4ab2437fa4e4aede8d6783fe7b68336cccb310f4fff73ce1'
      MANIFEST_BASE64: ''
    steps:
      - name: Download and verify signed release files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 --proto '=https' --tlsv1.2 --user-agent 'CabbitVisuals-CI/0.8.1' 'https://cabbit-visuals.captivatingode.chatgpt.site/releases/0.8.1.0/CabbitVisuals.exe' --output CabbitVisuals.exe
          printf '%s  CabbitVisuals.exe\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          printf '%s' "$MANIFEST_BASE64" | base64 --decode > stable.json
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CabbitVisuals.exe stable.json --clobber
          else
            gh release create "$TAG" CabbitVisuals.exe stable.json --target "$GITHUB_SHA" --latest --title 'Cabbit Visuals 0.8.1' --notes 'Автообновления через GitHub Releases. Улучшено восстановление сохранённого входа: при временных сетевых ошибках сессия сохраняется, подключение повторяется автоматически.'
          fi
